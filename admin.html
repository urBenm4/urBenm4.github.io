<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RiseStore | Admin Panel</title>
    <style>
        :root { --primary: #5865F2; --danger: #ED4245; --success: #3BA55D; --bg: #2F3136; --card: #36393F; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #DCDDDE; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #202225; cursor: pointer; border-radius: 5px; }
        .tab.active { background: var(--primary); color: white; }

        /* Form Elements */
        input, select { background: #202225; color: white; border: 1px solid #444; padding: 10px; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { cursor: pointer; border: none; border-radius: 4px; padding: 10px 20px; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-green { background: var(--success); color: white; }
        .btn-red { background: var(--danger); color: white; }
        
        /* Table Style */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; background: #202225; padding: 12px; font-size: 0.85rem; color: #8E9297; }
        td { padding: 12px; border-bottom: 1px solid #444; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-box" class="card">
        <h2 style="text-align: center;">RiseStore Admin</h2>
        <input type="text" id="adm-u" placeholder="Admin Username">
        <input type="password" id="adm-p" placeholder="Admin Password">
        <button onclick="doLogin()" style="width:100%; background: var(--primary); color:white;">LOGIN</button>
    </div>

    <div id="main-ui" class="hidden">
        <div class="tabs">
            <div id="tab-orders" class="tab active" onclick="showTab('orders')">Manage Orders</div>
            <div id="tab-users" class="tab" onclick="showTab('users')">User Passwords</div>
        </div>

        <div id="sec-orders" class="card">
            <h3>Order List</h3>
            <table>
                <thead><tr><th>ID</th><th>User</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="order-rows"></tbody>
            </table>
        </div>

        <div id="sec-users" class="card hidden">
            <h3>Registered Players</h3>
            <table>
                <thead><tr><th>Username</th><th>Email</th><th>New Password</th><th>Action</th></tr></thead>
                <tbody id="user-rows"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://6hka8t2vsc.execute-api.us-east-1.amazonaws.com";
    let adminAuth = { user: '', pass: '' };

    // Security: Escaping function to prevent XSS
    function esc(str) {
        if (!str) return "";
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function doLogin() {
        const u = document.getElementById('adm-u').value;
        const p = document.getElementById('adm-p').value;
        
        const res = await apiCall({ 
            action: 'listOrders', 
            adminUsername: u, 
            adminPassword: p 
        });

        if (res.success) {
            adminAuth = { user: u, pass: p };
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            loadOrders();
        } else {
            alert('Invalid Credentials!');
        }
    }

    function showTab(type) {
        document.getElementById('sec-orders').classList.toggle('hidden', type !== 'orders');
        document.getElementById('sec-users').classList.toggle('hidden', type !== 'users');
        document.getElementById('tab-orders').classList.toggle('active', type === 'orders');
        document.getElementById('tab-users').classList.toggle('active', type === 'users');
        type === 'orders' ? loadOrders() : loadUsers();
    }

    async function apiCall(data) {
        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
            return await res.json();
        } catch (e) {
            console.error("API Error:", e);
            return { success: false, items: [] };
        }
    }

    async function loadOrders() {
        const res = await apiCall({ 
            action: 'listOrders', 
            adminUsername: adminAuth.user, 
            adminPassword: adminAuth.pass 
        });
        
        const list = document.getElementById('order-rows');
        if (!res.items) return;

        list.innerHTML = res.items.map(o => `
            <tr>
                <td>${esc(o.orderId)}</td>
                <td>${esc(o.username)}</td>
                <td>₱${esc(o.total)}</td>
                <td>
                    <select id="st-${esc(o.orderId)}">
                        <option value="pending" ${o.status==='pending'?'selected':''}>PENDING</option>
                        <option value="completed" ${o.status==='completed'?'selected':''}>COMPLETED</option>
                    </select>
                </td>
                <td>
                    <button class="btn-green" onclick="updateOrder('${esc(o.orderId)}')">Save</button>
                    <button class="btn-red" onclick="deleteOrder('${esc(o.orderId)}')">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function loadUsers() {
        const res = await apiCall({ 
            action: 'listUsers', 
            adminUsername: adminAuth.user, 
            adminPassword: adminAuth.pass 
        });
        
        const list = document.getElementById('user-rows');
        if (!res.items) return;

        list.innerHTML = res.items.map(u => `
            <tr>
                <td>${esc(u.userId)}</td>
                <td>${esc(u.email)}</td>
                <td><input type="text" id="newpw-${esc(u.userId)}" placeholder="New Pass"></td>
                <td><button class="btn-green" onclick="changePass('${esc(u.userId)}')">Update</button></td>
            </tr>
        `).join('');
    }

    async function updateOrder(id) {
        const status = document.getElementById(`st-${id}`).value;
        await apiCall({ 
            action: 'admin', 
            subAction: 'update', 
            orderId: id, 
            updateFields: {status}, 
            adminUsername: adminAuth.user, 
            adminPassword: adminAuth.pass 
        });
        alert('Status updated!');
    }

    async function deleteOrder(id) {
        if(!confirm('Delete order?')) return;
        await apiCall({ 
            action: 'admin', 
            subAction: 'delete', 
            orderId: id, 
            adminUsername: adminAuth.user, 
            adminPassword: adminAuth.pass 
        });
        loadOrders();
    }

    async function changePass(uid) {
        const newPw = document.getElementById(`newpw-${uid}`).value;
        if(!newPw) return alert('Enter a password!');
        await apiCall({ 
            action: 'admin', 
            subAction: 'changeUserPass', 
            targetUserId: uid, 
            newPassword: newPw, 
            adminUsername: adminAuth.user, 
            adminPassword: adminAuth.pass 
        });
        alert('User password changed!');
        document.getElementById(`newpw-${uid}`).value = '';
    }
</script>
</body>
</html>
