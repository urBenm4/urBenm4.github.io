<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RiseStore | Admin Panel</title>
    <style>
        :root { --primary: #5865F2; --danger: #ED4245; --success: #3BA55D; --bg: #2F3136; --card: #36393F; --input-bg: #202225; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #DCDDDE; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: #202225; cursor: pointer; border-radius: 5px; user-select: none; transition: 0.15s; }
        .tab:hover { background: #2a2d31; }
        .tab.active { background: var(--primary); color: white; }
        input, select { background: var(--input-bg); color: white; border: 1px solid #444; padding: 8px 10px; border-radius: 4px; width: 100%; }
        input:focus, select:focus { outline: 1px solid var(--primary); border-color: var(--primary); }
        button { cursor: pointer; border: none; border-radius: 4px; padding: 8px 14px; font-weight: bold; transition: 0.15s; font-size: 13px; }
        button:hover { opacity: 0.85; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-red { background: var(--danger); color: white; }
        .btn-gray { background: #4f545c; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th { text-align: left; background: #202225; padding: 10px 12px; color: #8E9297; font-weight: 600; white-space: nowrap; }
        td { padding: 8px 10px; border-bottom: 1px solid #3a3d44; vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.03); }
        .hidden { display: none !important; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-pending { background: #f0a50030; color: #f0a500; }
        .badge-completed { background: #3ba55d30; color: #3ba55d; }
        .edit-input { background: var(--input-bg); color: white; border: 1px solid #555; padding: 5px 8px; border-radius: 4px; width: 100%; min-width: 80px; }
        .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        #login-box { max-width: 400px; margin: 80px auto; }
        #login-box h2 { text-align: center; margin-bottom: 20px; }
        #login-box input { margin-bottom: 12px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .section-header h3 { margin: 0; }
        .logout-btn { background: transparent; color: #8E9297; border: 1px solid #444; padding: 6px 14px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .logout-btn:hover { color: var(--danger); border-color: var(--danger); }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .topbar h2 { margin: 0; font-size: 18px; color: #fff; }
        .pill { background: #202225; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #8E9297; }
        .saving { opacity: 0.5; pointer-events: none; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: #3BA55D; color: white; padding: 12px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: opacity 0.3s; z-index: 999; }
        .toast.error { background: var(--danger); }
        .overflow-x { overflow-x: auto; }
    </style>
</head>
<body>
<div class="container">

    <div id="login-box" class="card hidden">
        <h2>RiseStore Admin</h2>
        <input type="text" id="adm-u" placeholder="Admin Username" autocomplete="username">
        <input type="password" id="adm-p" placeholder="Admin Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="doLogin()" style="width:100%;padding:12px;" class="btn-blue">Login</button>
    </div>

    <div id="main-ui" class="hidden">
        <div class="topbar">
            <h2>RiseStore Admin</h2>
            <div style="display:flex;gap:10px;align-items:center;">
                <span class="pill" id="logged-in-as"></span>
                <button class="logout-btn" onclick="doLogout()">Logout</button>
            </div>
        </div>

        <div class="tabs">
            <div id="tab-orders" class="tab" onclick="navigate('orders')">Orders</div>
            <div id="tab-users" class="tab" onclick="navigate('users')">Users</div>
        </div>

        <div id="sec-orders" class="card hidden">
            <div class="section-header">
                <h3>Orders</h3>
                <button class="btn-gray" onclick="loadOrders()">↺ Refresh</button>
            </div>
            <div class="overflow-x">
                <table>
                    <thead><tr>
                        <th>Order ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Items</th>
                        <th>Total (₱)</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr></thead>
                    <tbody id="order-rows"><tr><td colspan="8" style="text-align:center;color:#8E9297;">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div id="sec-users" class="card hidden">
            <div class="section-header">
                <h3>Users</h3>
                <button class="btn-gray" onclick="loadUsers()">↺ Refresh</button>
            </div>
            <div class="overflow-x">
                <table>
                    <thead><tr>
                        <th>User ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Password</th>
                        <th>Discord ID</th>
                        <th>Rank</th>
                        <th>Balance</th>
                        <th>Actions</th>
                    </tr></thead>
                    <tbody id="user-rows"><tr><td colspan="8" style="text-align:center;color:#8E9297;">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const API_URL = "https://6hka8t2vsc.execute-api.us-east-1.amazonaws.com";
let adminAuth = { user: '', pass: '' };

function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function showToast(msg, isError = false) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
}

async function apiCall(data) {
    try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data), headers: {'Content-Type': 'application/json'} });
        return await res.json();
    } catch(e) { return { success: false, error: e.message }; }
}

function navigate(page) {
    location.hash = page;
}

function handleHash() {
    if (!adminAuth.user) return;
    const page = location.hash.replace('#','') || 'orders';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('[id^="sec-"]').forEach(s => s.classList.add('hidden'));

    const tabEl = document.getElementById('tab-' + page);
    const secEl = document.getElementById('sec-' + page);
    if (tabEl) tabEl.classList.add('active');
    if (secEl) secEl.classList.remove('hidden');

    if (page === 'orders') loadOrders();
    if (page === 'users') loadUsers();
}

window.addEventListener('hashchange', handleHash);

async function doLogin() {
    const u = document.getElementById('adm-u').value.trim();
    const p = document.getElementById('adm-p').value;
    if (!u || !p) return showToast('Enter credentials', true);

    const res = await apiCall({ action: 'listOrders', adminUsername: u, adminPassword: p });
    if (res.success || res.items) {
        adminAuth = { user: u, pass: p };
        sessionStorage.setItem('adminAuth', JSON.stringify(adminAuth));
        showMainUI();
    } else {
        showToast('Invalid credentials', true);
    }
}

function doLogout() {
    sessionStorage.removeItem('adminAuth');
    adminAuth = { user: '', pass: '' };
    location.hash = '';
    document.getElementById('main-ui').classList.add('hidden');
    document.getElementById('login-box').classList.remove('hidden');
    document.getElementById('adm-p').value = '';
}

function showMainUI() {
    document.getElementById('login-box').classList.add('hidden');
    document.getElementById('main-ui').classList.remove('hidden');
    document.getElementById('logged-in-as').textContent = '👤 ' + adminAuth.user;
    if (!location.hash || location.hash === '#') location.hash = 'orders';
    else handleHash();
}

async function loadOrders() {
    const tbody = document.getElementById('order-rows');
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#8E9297;">Loading...</td></tr>';
    const res = await apiCall({ action: 'listOrders', adminUsername: adminAuth.user, adminPassword: adminAuth.pass });
    if (!res.items) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#ED4245;">Failed to load</td></tr>'; return; }
    if (!res.items.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#8E9297;">No orders</td></tr>'; return; }

    tbody.innerHTML = res.items.map(o => `
        <tr id="orow-${esc(o.orderId)}">
            <td><code style="background:#202225;padding:2px 6px;border-radius:4px;">${esc(o.orderId)}</code></td>
            <td><input class="edit-input" id="ou-${esc(o.orderId)}" value="${esc(o.username)}"></td>
            <td><input class="edit-input" id="oe-${esc(o.orderId)}" value="${esc(o.email)}"></td>
            <td><input class="edit-input" id="oi-${esc(o.orderId)}" value="${esc(Array.isArray(o.items) ? o.items.join(', ') : o.items)}" style="min-width:140px;"></td>
            <td><input class="edit-input" id="ot-${esc(o.orderId)}" value="${esc(o.total)}" style="max-width:70px;"></td>
            <td>
                <select id="os-${esc(o.orderId)}" style="background:#202225;color:white;border:1px solid #555;padding:5px 8px;border-radius:4px;width:130px;">
                    <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
                    <option value="completed" ${o.status==='completed'?'selected':''}>Completed</option>
                    <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
                </select>
            </td>
            <td style="white-space:nowrap;color:#8E9297;font-size:12px;">${esc(o.createdAt ? o.createdAt.replace('T',' ').slice(0,19) : '')}</td>
            <td>
                <div class="row-actions">
                    <button class="btn-green" onclick="saveOrder('${esc(o.orderId)}')">Save</button>
                    <button class="btn-red" onclick="deleteOrder('${esc(o.orderId)}')">Delete</button>
                </div>
            </td>
        </tr>
    `).join('');
}

async function saveOrder(id) {
    const row = document.getElementById('orow-' + id);
    row.classList.add('saving');

    const status = document.getElementById('os-' + id).value;
    await apiCall({ action: 'admin', subAction: 'update', orderId: id, updateFields: { status }, adminUsername: adminAuth.user, adminPassword: adminAuth.pass });

    row.classList.remove('saving');
    showToast('Order ' + id + ' saved');
}

async function deleteOrder(id) {
    if (!confirm('Delete order ' + id + '?')) return;
    await apiCall({ action: 'admin', subAction: 'delete', orderId: id, adminUsername: adminAuth.user, adminPassword: adminAuth.pass });
    document.getElementById('orow-' + id)?.remove();
    showToast('Order deleted');
}

async function loadUsers() {
    const tbody = document.getElementById('user-rows');
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#8E9297;">Loading...</td></tr>';
    const res = await apiCall({ action: 'listUsers', adminUsername: adminAuth.user, adminPassword: adminAuth.pass });
    if (!res.items) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#ED4245;">Failed to load</td></tr>'; return; }
    if (!res.items.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#8E9297;">No users</td></tr>'; return; }

    tbody.innerHTML = res.items.map(u => `
        <tr id="urow-${esc(u.userId)}">
            <td style="color:#8E9297;font-size:12px;">${esc(u.userId)}</td>
            <td><input class="edit-input" id="uun-${esc(u.userId)}" value="${esc(u.username)}"></td>
            <td><input class="edit-input" id="uem-${esc(u.userId)}" value="${esc(u.email)}"></td>
            <td><input class="edit-input" id="upw-${esc(u.userId)}" value="${esc(u.password)}" type="text" style="min-width:110px;font-family:monospace;"></td>
            <td><input class="edit-input" id="udi-${esc(u.userId)}" value="${esc(u.discordId || '')}" placeholder="—"></td>
            <td><input class="edit-input" id="urk-${esc(u.userId)}" value="${esc(u.rank || '')}" placeholder="—" style="max-width:80px;"></td>
            <td><input class="edit-input" id="ubl-${esc(u.userId)}" value="${esc(u.balance ?? '')}" placeholder="0" style="max-width:70px;"></td>
            <td>
                <div class="row-actions">
                    <button class="btn-green" onclick="saveUser('${esc(u.userId)}')">Save</button>
                </div>
            </td>
        </tr>
    `).join('');
}

async function saveUser(uid) {
    const row = document.getElementById('urow-' + uid);
    row.classList.add('saving');

    const newPw = document.getElementById('upw-' + uid).value;
    if (newPw) {
        await apiCall({ action: 'admin', subAction: 'changeUserPass', targetUserId: uid, newPassword: newPw, adminUsername: adminAuth.user, adminPassword: adminAuth.pass });
    }

    const updatedUser = {
        username: document.getElementById('uun-' + uid).value,
        email:    document.getElementById('uem-' + uid).value,
        discordId: document.getElementById('udi-' + uid).value,
        rank:     document.getElementById('urk-' + uid).value,
        balance:  document.getElementById('ubl-' + uid).value,
        password: newPw,
        userId:   uid
    };

    await apiCall({ action: 'createUser', ...updatedUser });

    row.classList.remove('saving');
    showToast('User ' + uid + ' saved');
}

(function init() {
    const saved = sessionStorage.getItem('adminAuth');
    if (saved) {
        try {
            adminAuth = JSON.parse(saved);
            showMainUI();
            return;
        } catch(e) {}
    }
    document.getElementById('login-box').classList.remove('hidden');
})();
</script>
</body>
</html>
